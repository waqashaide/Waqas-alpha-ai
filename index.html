<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>My Personal AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>My Personal AI</h1>
        <p id="status">Ready</p>
      </div>
      <button id="settingsBtn" class="icon">⚙️</button>
    </header>

    <section id="chat" class="chat"></section>

    <div class="controls">
      <button id="micBtn" class="mic">🎙️</button>
      <textarea id="input" rows="1" placeholder="Message your AI…"></textarea>
      <button id="sendBtn" class="send">➤</button>
    </div>
  </main>

  <dialog id="settings">
    <h2>Assistant Settings</h2>
    <label>OpenRouter API key
      <input id="apiKey" type="password" placeholder="sk-or-v1-...">
    </label>
    <label>Assistant name
      <input id="assistantName" value="Nova">
    </label>
    <label>Personality
      <textarea id="personality">You are my personal AI assistant. Be helpful, direct, calm and practical. Speak naturally in the language I use. Keep answers concise unless I ask for detail. Remember useful facts saved in memory.</textarea>
    </label>
    <div class="row">
      <button id="saveSettings">Save</button>
      <button id="clearMemory">Clear memory</button>
      <button id="closeSettings">Close</button>
    </div>
    <small>For a personal prototype, the API key is stored only in this browser's local storage. Do not publish this app with your key inside it.</small>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
