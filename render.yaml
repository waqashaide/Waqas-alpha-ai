services:
  - type: web
    name: auto-clipper
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: TRANSCRIBER_PROVIDER
        value: groq
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FACE_TRACKING_MODE
        value: dynamic
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: DB_PATH
        value: /tmp/auto_clipper.db
